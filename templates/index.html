<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Indian Sign Language</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- FontAwesome for icons -->
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>Speech to Indian Sign Language</h1>
        <div class="navbar">
            <header>
                <nav>
                    <ul>
                        <li><a href="{{ url_for('home') }}">Home</a></li>
                        <li><a href="{{ url_for('history') }}">History</a></li>
                        <li><a href="{{ url_for('about') }}">About</a></li>
                        <li><a href="{{ url_for('contact') }}">Contact</a></li>
                    </ul>
                </nav>
            </header>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <textarea class="speech-input" placeholder="Your speech will appear here..."></textarea>
            <div class="buttons">
                <button id="start-recording"><i class="fas fa-microphone"></i> Start Recording</button>
                <button id="clear-text"><i class="fas fa-trash"></i> Clear</button>
            </div>

            <h2>ISL Translation</h2>
            <textarea class="translation-text" placeholder="Processed text will appear here..." readonly></textarea>
        </div>

        <!-- Right Section - Animation Box -->
        <div class="right-section">
            <p>Animation will appear here...</p>
        </div>
    </div>

</body>
</html>
